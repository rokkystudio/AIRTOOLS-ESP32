[platformio]
default_envs = lolin32

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -D AIRTOOLS_FIRMWARE_VERSION=0x000100
    -D AIRTOOLS_MAX_NETWORKS=64
    -D AIRTOOLS_MAX_CLIENTS=96
    -D AIRTOOLS_BLE_MTU=247

[env:lolin32]
board = lolin32
build_flags =
    ${env.build_flags}
    -D AIRTOOLS_BOARD_ID=1
    -D AIRTOOLS_HAS_DISPLAY=0
    -D AIRTOOLS_HAS_SD=0
    -D AIRTOOLS_HAS_BATTERY_ADC=1
    -D AIRTOOLS_BATTERY_ADC_PIN=35

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D AIRTOOLS_BOARD_ID=2
    -D AIRTOOLS_HAS_DISPLAY=0
    -D AIRTOOLS_HAS_SD=0
    -D AIRTOOLS_HAS_BATTERY_ADC=0

[env:nodemcu-32s]
board = nodemcu-32s
build_flags =
    ${env.build_flags}
    -D AIRTOOLS_BOARD_ID=3
    -D AIRTOOLS_HAS_DISPLAY=0
    -D AIRTOOLS_HAS_SD=0
    -D AIRTOOLS_HAS_BATTERY_ADC=0

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D AIRTOOLS_BOARD_ID=4
    -D AIRTOOLS_HAS_DISPLAY=0
    -D AIRTOOLS_HAS_SD=0
    -D AIRTOOLS_HAS_BATTERY_ADC=0

[env:esp32-s3-generic-lcd147]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -D AIRTOOLS_BOARD_ID=5
    -D AIRTOOLS_HAS_DISPLAY=1
    -D AIRTOOLS_HAS_ST7789=1
    -D AIRTOOLS_HAS_SD=1
    -D AIRTOOLS_HAS_BATTERY_ADC=1
    -D AIRTOOLS_BATTERY_ADC_PIN=4

[env:esp32-c6-touch-lcd147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.partitions = default_8MB.csv
extra_scripts =
    pre:scripts/shorten_arduino_includes.py
lib_deps =
    h2zero/NimBLE-Arduino@2.3.8
    moononournation/GFX Library for Arduino@1.6.8
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    ${env.build_flags}
    -D AIRTOOLS_BOARD_ID=6
    -D AIRTOOLS_NIMBLE_V2=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D AIRTOOLS_HAS_DISPLAY=1
    -D AIRTOOLS_HAS_JD9853=1
    -D AIRTOOLS_LCD_WIDTH=172
    -D AIRTOOLS_LCD_HEIGHT=320
    -D AIRTOOLS_LCD_SCK_PIN=1
    -D AIRTOOLS_LCD_MOSI_PIN=2
    -D AIRTOOLS_LCD_CS_PIN=14
    -D AIRTOOLS_LCD_DC_PIN=15
    -D AIRTOOLS_LCD_RST_PIN=22
    -D AIRTOOLS_LCD_BL_PIN=23
    -D AIRTOOLS_HAS_TOUCH=1
    -D AIRTOOLS_HAS_AXS5106L=1
    -D AIRTOOLS_TOUCH_SDA_PIN=18
    -D AIRTOOLS_TOUCH_SCL_PIN=19
    -D AIRTOOLS_TOUCH_RST_PIN=20
    -D AIRTOOLS_TOUCH_INT_PIN=21
    -D AIRTOOLS_HAS_SD=1
    -D AIRTOOLS_SD_SCK_PIN=1
    -D AIRTOOLS_SD_MOSI_PIN=2
    -D AIRTOOLS_SD_MISO_PIN=3
    -D AIRTOOLS_SD_CS_PIN=4
    -D AIRTOOLS_HAS_BATTERY_ADC=1
    -D AIRTOOLS_BATTERY_ADC_PIN=0
    -D AIRTOOLS_BATTERY_DIVIDER_NUM=3
    -D AIRTOOLS_BATTERY_DIVIDER_DEN=1
